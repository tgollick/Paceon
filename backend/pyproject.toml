[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Thomas Gollick", email = "thomasgollick@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
include = ["app", "tests"]
exclude = [".venv"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration"]
